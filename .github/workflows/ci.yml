name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    name: lint, typecheck, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentinel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check app/

      - name: Typecheck (mypy)
        run: uv run mypy app/ --ignore-missing-imports

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sentinel_test
          JWT_SECRET: test-secret-not-real
          WEBHOOK_SECRET: test-secret-not-real
          OPENAI_API_KEY: sk-test-not-real
        run: uv run alembic upgrade head

      - name: Unit tests
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sentinel_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret-not-real
          WEBHOOK_SECRET: test-secret-not-real
          OPENAI_API_KEY: sk-test-not-real
        run: uv run pytest tests/ -v

  eval-gate:
    name: agent quality gate
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync

      - name: Run eval harness (fails if accuracy regresses)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o
          OPENAI_EMBEDDING_MODEL: text-embedding-3-small
          JWT_SECRET: test-secret-not-real
          WEBHOOK_SECRET: test-secret-not-real
        run: uv run python -m app.eval.run_eval
