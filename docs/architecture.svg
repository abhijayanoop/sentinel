<svg viewBox="0 0 840 960" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sentinel's incident-response pipeline: a trigger creates a signed incident, an agent gathers evidence and proposes a risk-scored fix, a human approves it, the fix executes against real AWS, gets verified, and the outcome is stored as memory that feeds future diagnoses.">
  <title>Sentinel incident-response pipeline</title>
  <rect x="0" y="0" width="840" height="960" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/>
    </marker>
  </defs>

  <!-- font baseline -->
  <g font-family="Helvetica, Arial, sans-serif" fill="#0f172a">

    <!-- Trigger A: CloudWatch Alarm -->
    <rect x="40" y="20" width="260" height="60" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="170" y="46" font-size="13" font-weight="600" text-anchor="middle">CloudWatch Alarm</text>
    <text x="170" y="64" font-size="11" text-anchor="middle" fill="#475569">HealthyHostCount &lt; 1</text>

    <!-- Trigger B: chaos.py -->
    <rect x="540" y="20" width="260" height="60" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="670" y="46" font-size="13" font-weight="600" text-anchor="middle">chaos.py break</text>
    <text x="670" y="64" font-size="11" text-anchor="middle" fill="#475569">manual chaos test</text>

    <!-- Webhook -->
    <rect x="220" y="140" width="400" height="70" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="420" y="169" font-size="13" font-weight="600" text-anchor="middle">POST /webhooks/cloudwatch</text>
    <text x="420" y="188" font-size="11" text-anchor="middle" fill="#475569">HMAC verified · Incident row written</text>

    <!-- Arrows: triggers -> webhook -->
    <line x1="170" y1="80" x2="378" y2="138" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="230" y="118" font-size="11" text-anchor="middle" fill="#475569">alarm state</text>
    <line x1="670" y1="80" x2="462" y2="138" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="610" y="118" font-size="11" text-anchor="middle" fill="#475569">manual trigger</text>

    <!-- Arrow: webhook -> agent -->
    <line x1="420" y1="210" x2="420" y2="258" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="430" y="238" font-size="11" fill="#475569">background task</text>

    <!-- Agent -->
    <rect x="180" y="260" width="480" height="90" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="420" y="288" font-size="14" font-weight="700" text-anchor="middle">LangGraph Agent</text>
    <text x="420" y="309" font-size="11" text-anchor="middle" fill="#475569">evidence: deploys · metrics · ECS events · logs · memory search</text>
    <text x="420" y="326" font-size="11" text-anchor="middle" fill="#475569">→ risk-scored diagnosis</text>

    <!-- Escalate -->
    <rect x="700" y="260" width="120" height="90" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="760" y="292" font-size="12" font-weight="600" text-anchor="middle">Escalate</text>
    <text x="760" y="310" font-size="10.5" text-anchor="middle" fill="#7f1d1d">human notified</text>
    <text x="760" y="325" font-size="10.5" text-anchor="middle" fill="#7f1d1d">no auto-action</text>

    <!-- Arrow: agent -> escalate -->
    <line x1="660" y1="305" x2="698" y2="305" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="679" y="296" font-size="10.5" text-anchor="middle" fill="#475569">risk: high</text>

    <!-- Arrow: agent -> approval -->
    <line x1="420" y1="350" x2="420" y2="418" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="430" y="388" font-size="11" fill="#475569">risk: low / medium</text>

    <!-- Approval -->
    <rect x="220" y="420" width="400" height="70" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="420" y="449" font-size="13" font-weight="600" text-anchor="middle">Approval requested</text>
    <text x="420" y="468" font-size="11" text-anchor="middle" fill="#78350f">signed single-use token · status: pending</text>

    <!-- Dashboard -->
    <rect x="700" y="420" width="120" height="70" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="760" y="446" font-size="12" font-weight="600" text-anchor="middle">Dashboard</text>
    <text x="760" y="462" font-size="10.5" text-anchor="middle" fill="#475569">(React)</text>
    <text x="760" y="477" font-size="10.5" text-anchor="middle" fill="#475569">polls every 5s</text>

    <!-- bidirectional arrow: approval <-> dashboard -->
    <line x1="622" y1="455" x2="698" y2="455" stroke="#475569" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="660" y="444" font-size="10.5" text-anchor="middle" fill="#475569">human approves</text>

    <!-- Arrow: approval -> execute -->
    <line x1="420" y1="490" x2="420" y2="558" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="430" y="528" font-size="11" fill="#475569">approved</text>

    <!-- Execute -->
    <rect x="220" y="560" width="400" height="70" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="420" y="589" font-size="13" font-weight="600" text-anchor="middle">Execute action</text>
    <text x="420" y="608" font-size="11" text-anchor="middle" fill="#475569">restart_task / rollback_deploy — real ECS</text>

    <!-- Arrow: execute -> verify -->
    <line x1="420" y1="630" x2="420" y2="688" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="430" y="664" font-size="11" fill="#475569">poll health (~3 min)</text>

    <!-- Verify -->
    <rect x="220" y="690" width="400" height="70" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="420" y="719" font-size="13" font-weight="600" text-anchor="middle">Verify resolution</text>
    <text x="420" y="738" font-size="11" text-anchor="middle" fill="#475569">status → resolved / action_failed</text>

    <!-- Arrow: verify -> memory -->
    <line x1="420" y1="760" x2="420" y2="818" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="430" y="794" font-size="11" fill="#475569">embed + store outcome</text>

    <!-- Memory -->
    <rect x="220" y="820" width="400" height="80" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
    <text x="420" y="852" font-size="13" font-weight="600" text-anchor="middle">Postgres + pgvector</text>
    <text x="420" y="872" font-size="11" text-anchor="middle" fill="#3730a3">Incident Memory</text>

    <!-- Feedback loop: memory -> agent (RAG) -->
    <path d="M 220 855 L 90 855 L 90 305 L 178 305" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowIndigo)"/>
    <text x="60" y="580" font-size="10.5" fill="#4338ca" text-anchor="middle" transform="rotate(-90 60 580)">past-incident search (RAG)</text>

  </g>
</svg>
